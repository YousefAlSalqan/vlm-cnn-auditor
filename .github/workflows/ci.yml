name: V1 checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auditor_test_ci
          POSTGRES_USER: auditor_test
          POSTGRES_PASSWORD: disposable_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auditor_test -d auditor_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUDITOR_TEST_DATABASE_URL: postgresql+psycopg://auditor_test:disposable_ci_only@127.0.0.1:5432/auditor_test_ci
      AUDITOR_BROWSER_TESTS: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-cpu.lock
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -c requirements-cpu.lock -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q --tb=short
