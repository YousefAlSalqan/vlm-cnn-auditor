[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-cnn-auditor"
version = "0.1.0"
description = "Local, evidence-preserving review of YOLO cup detections"
requires-python = ">=3.11,<3.14"
dependencies = [
  "gradio==6.32.0", "SQLAlchemy==2.0.57", "psycopg[binary]==3.3.9",
  "alembic==1.20.1", "pydantic==2.14.3", "pydantic-settings==2.16.3",
  "opencv-python==4.14.0.94", "httpx==0.28.1", "filelock==4.2.10",
  "numpy==2.4.6",
]

[project.optional-dependencies]
models = ["ultralytics==8.4.215"]
dev = ["pytest==9.2.0", "ruff==0.17.5", "jsonschema==4.26.0", "playwright==1.65.2"]

[tool.setuptools.packages.find]
include = ["auditor*"]

[tool.setuptools.package-data]
auditor = ["prompts/*.txt", "style.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "review_core_*.py"]
markers = ["integration: requires a disposable PostgreSQL database", "browser: requires Chromium"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
